<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Player - Inter Miami Boys</title>
    <link rel="stylesheet" href="style.css?v=9">
    <style>
        .admin-dashboard { width: 100%; max-width: 600px; margin: auto; padding: 20px; box-sizing: border-box; }
        .admin-card { background: #111116; padding: 25px; border-radius: 20px; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #fff; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        .admin-button { width: 100%; padding: 15px; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; background: #f5b5d2; color: #111116; }
        .back-button { display: block; text-align: center; margin-top: 15px; color: #f5b5d2; text-decoration: none; }
        #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <main class="admin-dashboard">
        <header style="text-align:center;">
            <div class="team-logo">IMB</div>
            <h1>Inter Miami Boys</h1>
            <p>Admin - Add New Player</p>
        </header>

        <section class="admin-card">
            <form id="addPlayerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Lionel Messi" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="player@example.com" required>
                </div>
                <div class="form-group">
                    <label>Jersey Number</label>
                    <input type="number" id="jerseyNumber" placeholder="10" required>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" placeholder="Forward" required>
                </div>
                <div class="form-group">
                    <label>Temporary Password for Player</label>
                    <input type="text" id="tempPassword" value="IMB2026!" required>
                </div>
                <button type="submit" class="admin-button">⚡ Generate Code & Add Player</button>
            </form>

            <p id="statusMessage"></p>
            <a href="admin-dashboard.html" class="back-button">← Back to Admin Dashboard</a>
        </section>
    </main>

    <script type="module" src="add-player.js"></script>
</body>
</html>
