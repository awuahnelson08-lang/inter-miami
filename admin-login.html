<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Inter Miami Boys</title>

    <link rel="stylesheet" href="style.css?v=5">

    <style>
        .admin-dashboard {
            width: 100%;
            max-width: 450px;
            margin: 40px auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-card {
            background: #111116;
            padding: 25px;
            border-radius: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #fff;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }

        .admin-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #f5b5d2;
            color: #111116;
            margin-top: 10px;
        }

        #errorMessage {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="admin-dashboard">

        <header class="admin-header">
            <div class="team-logo">IMB</div>
            <h1>Inter Miami Boys</h1>
            <p>Admin Login</p>
        </header>

        <section class="admin-card">
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="admin-button">
                    🔐 Login to Dashboard
                </button>
            </form>

            <p id="errorMessage"></p>
        </section>

    </main>

    <script type="module" src="admin-login.js"></script>

</body>

</html>
