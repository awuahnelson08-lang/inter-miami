<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Login - Inter Miami Boys</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <main class="auth-page">

        <section class="auth-container">

            <div class="team-logo">
                IMB
            </div>

            <h1>Inter Miami Boys</h1>

            <p class="auth-subtitle">
                Player Login
            </p>

            <div class="auth-card">

                <h2>Log In</h2>

                <p id="errorMessage" class="error-message"></p>

                <form id="loginForm">

                    <div class="form-group">

                        <label for="playerCode">
                            Player Code
                        </label>

                        <input
                            type="text"
                            id="playerCode"
                            placeholder="Example: IMB-A7K92P"
                            required
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <p class="already">
                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>
                    </p>


                    <button
                        type="submit"
                        class="btn login-btn">
                        🔐 Log In
                    </button>

                </form>


                <p class="already">

                    Don't have an account?

                    <a href="register.html">
                        Sign Up
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script type="module" src="login.js"></script>

</body>

</html>
