<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Player Login - Inter Miami Boys</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">

            <h1>Inter Miami Boys</h1>

            <p class="auth-subtitle">
                Player Login
            </p>


            <div class="auth-card">

                <h2>Log In</h2>


                <!-- ERROR MESSAGE -->
                <p id="errorMessage"
                   style="color: #ff6b6b;">
                </p>


                <!-- LOGIN FORM -->
                <form id="loginForm">


                    <!-- PLAYER CODE -->
                    <div class="form-group">

                        <label for="playerCode">
                            Player Code
                        </label>

                        <input
                            type="text"
                            id="playerCode"
                            placeholder="Example: IMB-A7K92P"
                            required
                            autocomplete="off"
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- FORGOT PASSWORD -->
                    <p>

                        <a href="#"
                           id="forgotPassword">

                            Forgot Password?

                        </a>

                    </p>


                    <!-- LOGIN BUTTON -->
                    <button type="submit">

                        Log In

                    </button>


                </form>


                <!-- REGISTER -->
                <p>

                    Don't have an account?

                    <a href="register.html">
                        Sign Up
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script type="module"
            src="login.js">
    </script>

</body>

</html>
