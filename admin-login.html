<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Inter Miami Boys</title>

    <link rel="stylesheet" href="style.css?v=5">

    <style>
        .admin-dashboard {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin-bottom: 5px;
        }

        .admin-header p {
            margin-top: 5px;
        }

        .admin-card {
            background: #111116;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            margin-top: 0;
        }

      .admin-player-button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    border-radius: 30px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    background: #f5b5d2;
    color: #111116;
      }
        .admin-buttons {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .admin-buttons button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #f5b5d2;
            color: #111116;
        }

        .logout-button {
            background: transparent !important;
            color: #f5b5d2 !important;
            border: 2px solid #f5b5d2 !important;
        }

        #adminMessage {
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>

<body>

    <main class="admin-dashboard">

        <header class="admin-header">

            <div class="team-logo">
                IMB
            </div>

            <h1>Inter Miami Boys</h1>

            <p>Admin Control Panel</p>

        </header>


        <section class="admin-card">

            <h2>Welcome, Administrator 👋</h2>

            <p>
                You have access to the Inter Miami Boys
                management system.
            </p>

        </section>


        <section class="admin-card">

            <h2>Admin Menu</h2>

            <div class="admin-buttons">

     <a
    href="players.html"
    class="admin-player-button">
    👥 View All Players
     </a>

                <button
                    type="button"
                    id="messageButton">
                    📢 Send Information
                </button>

                <button
                    type="button"
                    id="announcementButton">
                    📣 Announcements
                </button>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button">
                    🚪 Logout
                </button>

            </div>

            <p id="adminMessage"></p>

        </section>

    </main>


    <script type="module">

        import {
            auth,
            db,
            onAuthStateChanged,
            signOut,
            doc,
            getDoc
        } from "./firebase.js";


        const adminMessage =
            document.getElementById("adminMessage");

        const logoutButton =
            document.getElementById("logoutButton");


        // Check admin login
        onAuthStateChanged(
            auth,
            // @ts-ignore
            async function(user) {

                if (!user) {

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                try {

                    const adminRef =
                        doc(
                            db,
                            "admins",
                            user.uid
                        );


                    const adminSnap =
                        await getDoc(adminRef);


                    if (!adminSnap.exists()) {

                        await signOut(auth);

                        adminMessage.textContent =
                            "Admin account not found.";

                        adminMessage.style.color =
                            "red";

                        setTimeout(function() {

                            window.location.href =
                                "admin-login.html";

                        }, 1500);

                        return;
                    }


                    const adminData =
                        adminSnap.data();


                    if (adminData.role !== "admin") {

                        await signOut(auth);

                        adminMessage.textContent =
                            "This account does not have admin access.";

                        adminMessage.style.color =
                            "red";

                        setTimeout(function() {

                            window.location.href =
                                "admin-login.html";

                        }, 1500);

                        return;
                    }


                    adminMessage.textContent =
                        "Admin access verified ✓";

                    adminMessage.style.color =
                        "green";

                } catch (error) {

                    console.error(
                        "Admin verification error:",
                        error
                    );

                    adminMessage.textContent =
                        "Error: " + error.message;

                    adminMessage.style.color =
                        "red";
                }

            }
        );


        // Logout
        logoutButton.addEventListener(
            "click",
            async function() {

                try {

                    await signOut(auth);

                    localStorage.removeItem(
                        "adminUid"
                    );

                    localStorage.removeItem(
                        "adminEmail"
                    );

                    localStorage.removeItem(
                        "adminRole"
                    );

                    window.location.href =
                        "admin-login.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );


        // Temporary buttons
        document.getElementById(
            "playersButton"
        ).addEventListener(
            "click",
            function() {

                alert(
                    "Players management will be added next."
                );

            }
        );


        document.getElementById(
            "messageButton"
        ).addEventListener(
            "click",
            function() {

                alert(
                    "Messaging system will be added next."
                );

            }
        );


        document.getElementById(
            "announcementButton"
        ).addEventListener(
            "click",
            function() {

                alert(
                    "Announcement system will be added next."
                );

            }
        );

    </script>

</body>

</html>
